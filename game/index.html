<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div class="stat">Health: <span id="health-display">100</span></div>
            <div class="stat">Gold: <span id="gold-display">50</span></div>
            <div class="stat">Wave: <span id="wave-display">1</span></div>
            <div class="stat">Score: <span id="score-display">0</span></div>
            <div class="stat">Enemy Resources: <span id="enemy-resources-display">100%</span></div>
        </div>

        <div id="hud-actions" class="hidden">
            <button id="pause-btn" class="action-btn hud-btn">Pause</button>
            <button id="settings-btn" class="action-btn hud-btn">Settings</button>
        </div>

        <div id="event-banner" class="hidden"></div>

        <button id="mobile-controls-toggle" class="action-btn hidden">Deploy</button>

        <div id="controls" class="hidden">
            <button id="btn-tower" class="unit-btn selected" data-map-mode="land">Tower (50g)</button>
            <button id="btn-spawn-tower" class="unit-btn" data-map-mode="land">Spawn Tower (90g)</button>
            <button id="btn-tank-spawn-tower" class="unit-btn" data-map-mode="land">Tank Tower (220g)</button>
            <button id="btn-barbed-wire" class="unit-btn" data-map-mode="land">Barbed Wire (40g)</button>
            <button id="btn-trench" class="unit-btn" data-map-mode="land">Trench (60g)</button>
            <button id="btn-repair-base" class="unit-btn" data-map-mode="land">Repair Base (130g)</button>
            <button id="btn-airport" class="unit-btn" data-map-mode="land">Airport (180g)</button>
            <button id="btn-bunker" class="unit-btn" data-map-mode="land">Bunker (170g)</button>
            <button id="btn-soldier" class="unit-btn" data-map-mode="land">Soldier (30g)</button>
            <button id="btn-tank" class="unit-btn" data-map-mode="land">Tank (150g)</button>
            <button id="btn-plane" class="unit-btn" data-map-mode="land">Plane (160g)</button>
            <button id="btn-bulldozer" class="unit-btn" data-map-mode="land">Bulldozer (95g)</button>
            <button id="btn-sniper" class="unit-btn" data-map-mode="land">Sniper (80g)</button>
            <button id="btn-artillery" class="unit-btn" data-map-mode="land">Artillery (120g)</button>
            <button id="btn-drone" class="unit-btn" data-map-mode="land">Drone (110g)</button>
            <button id="btn-submarine" class="unit-btn hidden" data-map-mode="ocean">Submarine (140g)</button>
            <button id="btn-aircraft-carrier" class="unit-btn hidden" data-map-mode="ocean">Aircraft Carrier (260g)</button>
            <button id="btn-rocket-station" class="unit-btn" data-map-mode="land">Rocket Station (140g)</button>
            <button id="btn-nuclear-launcher" class="unit-btn">Nuclear Launcher (400g)</button>
            <button id="btn-launch-rockets" class="action-btn">Launch Rocket</button>
            <button id="btn-launch-nuke" class="action-btn">Launch Nuke</button>
        </div>

        <div id="start-screen" class="screen">
            <img src="assets/images/Untitled.png" alt="Game Logo"
                style="max-width: 300px; display: block; margin: 0 auto 20px auto;">
            <h1>War Simulator</h1>
            <p>Defend the base from the smart enemies!</p>
            <button id="start-btn" class="btn">Play Game</button>
            <button id="custom-map-btn" class="btn secondary-btn">Make a custom map.</button>
            <button id="start-settings-btn" class="btn secondary-btn">Settings</button>
            <div class="controls-hint">
                <p>Controls: Mouse to place towers, ESC to pause</p>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">Play Again</button>
            <button id="menu-btn" class="btn" style="margin-top: 10px; background-color: #2196F3;">Main Menu</button>
        </div>

        <div id="victory-screen" class="screen hidden">
            <h1>Victory</h1>
            <p>Score: <span id="victory-score">0</span></p>
            <button id="victory-restart-btn" class="btn">Play Again</button>
            <button id="victory-menu-btn" class="btn" style="margin-top: 10px; background-color: #2196F3;">Main Menu</button>
        </div>

        <div id="pause-screen" class="screen hidden">
            <h1>Paused</h1>
            <button id="resume-btn" class="btn">Resume</button>
            <button id="pause-menu-btn" class="btn" style="margin-top: 10px; background-color: #2196F3;">Main Menu</button>
            <button id="pause-settings-btn" class="btn secondary-btn">Settings</button>
        </div>

        <div id="settings-screen" class="screen hidden">
            <h1>Settings</h1>
            <div class="settings-panel">
                <label for="game-speed-select">Game Speed</label>
                <select id="game-speed-select">
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                </select>
                <label for="artillery-sound-select">Artillery Sound</label>
                <select id="artillery-sound-select">
                    <option value="assets/sounds/artillery sounds/cannon-sound-effect-hd-for-videos-and-games.mp3" selected>Cannon</option>
                    <option value="assets/sounds/artillery sounds/3-minutes-of-wwii-german-flak-88-firing(1).mp3">Flak 88</option>
                </select>
                <button id="mute-audio-btn" class="action-btn">Mute Audio: Off</button>
            </div>
            <button id="settings-back-btn" class="btn">Back</button>
        </div>

        <div id="custom-map-screen" class="screen hidden">
            <h1>Custom Map</h1>
            <p id="custom-map-description">Choose a tile and click the battlefield to build your map.</p>
            <div id="custom-map-modes">
                <button id="editor-land-mode-btn" class="unit-btn selected">Land Map</button>
                <button id="editor-ocean-mode-btn" class="unit-btn">Ocean Map</button>
            </div>
            <div id="custom-map-controls">
                <button id="editor-rock-btn" class="unit-btn selected">Rock</button>
                <button id="editor-wall-btn" class="unit-btn">Wall</button>
                <button id="editor-bunker-btn" class="unit-btn">Bunker</button>
                <button id="editor-erase-btn" class="unit-btn">Eraser</button>
            </div>
            <div id="custom-map-actions">
                <button id="editor-save-btn" class="btn">Save Map</button>
                <button id="editor-play-btn" class="btn secondary-btn">Battle On Map</button>
                <button id="editor-back-btn" class="btn secondary-btn">Back</button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Scripts -->
    <script src="js/input.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/fsm.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/enemyArtillery.js"></script>
    <script src="js/enemySniper.js"></script>
    <script src="js/enemyTank.js"></script>
    <script src="js/enemyPlane.js"></script>
    <script src="js/tower.js"></script>
    <script src="js/spawnTower.js"></script>
    <script src="js/tankSpawnTower.js"></script>
    <script src="js/barbedWire.js"></script>
    <script src="js/trench.js"></script>
    <script src="js/repairBase.js"></script>
    <script src="js/airport.js"></script>
    <script src="js/bunker.js"></script>
    <script src="js/soldier.js"></script>
    <script src="js/tank.js"></script>
    <script src="js/tankWreck.js"></script>
    <script src="js/plane.js"></script>
    <script src="js/bulldozer.js"></script>
    <script src="js/sniper.js"></script>
    <script src="js/artillery.js"></script>
    <script src="js/drone.js"></script>
    <script src="js/submarine.js"></script>
    <script src="js/aircraftCarrier.js"></script>
    <script src="js/enemySubmarine.js"></script>
    <script src="js/enemyAircraftCarrier.js"></script>
    <script src="js/supplyCrate.js"></script>
    <script src="js/rocketStation.js"></script>
    <script src="js/nuclearLauncher.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
